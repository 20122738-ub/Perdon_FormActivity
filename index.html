<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>
    <h1>HTML Form</h1>
    <form>
        <fieldset><p>
            <legend><h3>Personal Information</h3></legend>
                    <label for="name">Name:</label><br>
                <input type="text" id="name" name="name"><br>
                    <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
        </p></fieldset>
    <br>
        <fieldset><p>
            <legend><b>Gender</b></legend>
                <input type="radio" id="male" name="male" value="Male">
                    <label for="male">Male</label><br>
                <input type="radio" id="female" name="female" value="Female">
                    <label for="female">Female</label><br>
                <input type="radio" id="other" name="other" value="Other">
                    <label for="other">Other</label><br>
        </p></fieldset>
    <br>
        <fieldset><p>
            <legend><b>Hobbies</b></legend>
                <input type="checkbox" id="drawing" name="drawing" value="Drawing">
                    <label for="drawing">Drawing</label><br>
                <input type="checkbox" id="reading" name="reading" value="Reading">
                    <label for="reading">Reading</label><br>
                <input type="checkbox" id="writing" name="writing" value="Writing">
                    <label for="writing">Writing</label><br>
                <input type="checkbox" id="photography" name="photography" value="Photography">
                    <label for="photography">Photography</label><br>
                <input type="checkbox" id="outdoor_sports" name="outdoor_sports" value="Outdoor_sports">
                    <label for="outdoor_sports">Outdoor Sports</label><br>
                <input type="checkbox" id="video_games" name="video_games" value="Video_games">
                    <label for="video_games">Playing Video Games</label><br>
                <input type="checkbox" id="walking" name="walking" value="Walking">
                    <label for="walking">Walking</label><br>
                <input type="checkbox" id="cycling" name="cycling" value="Cycling">
                    <label for="cycling">Cycling</label><br>
                <input type="checkbox" id="traveling" name="traveling" value="Traveling">
                    <label for="traveling">Traveling</label><br>
                <input type="checkbox" id="cooking" name="cooking" value="Cooking">
                    <label for="cooking">Cooking</label><br>
                <input type="checkbox" id="cleaning" name="cleaning" value="Cleaning">
                    <label for="cleaning">Cleaning</label><br>
            </p></fieldset>
                <p><b>Additional comments:</b><br>
                     <textarea name="message" rows="10" cols="30"></textarea>
                     </p>
            <input type="submit" value="Submit">
    </form>
</body>
</html>
